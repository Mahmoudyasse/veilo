/* Layout: full-bleed liquid-glass phone UI. Content column max 520px, glass tab bar + side drawer + Dynamic Island float above it. */
:root{
  --font:"iOS15",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --spring:cubic-bezier(.34,1.32,.42,1);
  --soft:cubic-bezier(.22,.9,.28,1);
}
/* mode tokens: dark (default) and light */
:root,:root[data-mode="dark"]{
  --bg1:var(--d-bg1);--bg2:var(--d-bg2);--o1:var(--d-o1);--o2:var(--d-o2);--o3:var(--d-o3);--acc1:var(--d-a1);--acc2:var(--d-a2);--acc-ink:var(--d-ai);
  --glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.17);--stroke:rgba(255,255,255,.2);--hi:rgba(255,255,255,.34);--sheen:rgba(255,255,255,.14);
  --shadow:rgba(0,0,0,.55);--sheet:color-mix(in srgb,var(--bg2) 88%,transparent);--field:rgba(255,255,255,.07);
  --ink:#f5f4fb;--ink2:rgba(245,244,251,.64);--danger:#ff7a8a;--ok:#41d98b;color-scheme:dark;
}
:root[data-mode="light"]{
  --bg1:var(--l-bg1);--bg2:var(--l-bg2);--o1:var(--l-o1);--o2:var(--l-o2);--o3:var(--l-o3);--acc1:var(--l-a1);--acc2:var(--l-a2);--acc-ink:var(--l-ai);
  --glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.85);--stroke:rgba(255,255,255,.95);--hi:#fff;--sheen:rgba(255,255,255,.7);
  --shadow:rgba(40,50,95,.22);--sheet:color-mix(in srgb,var(--bg2) 92%,transparent);--field:rgba(255,255,255,.7);
  --ink:#14182b;--ink2:rgba(20,24,43,.62);--danger:#d3294a;--ok:#14a85c;color-scheme:light;
}
/* theme palettes: --d-* for dark mode, --l-* for light mode */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg1);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;direction:rtl;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc1);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ambient liquid background */
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2))}
.orbs i{position:absolute;border-radius:50%;filter:blur(72px);opacity:.7;animation:drift 24s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:min(60vmax,560px);height:min(60vmax,560px);background:var(--o1);top:-10%;right:-16%}
.orbs i:nth-child(2){width:min(50vmax,480px);height:min(50vmax,480px);background:var(--o2);bottom:-8%;left:-14%;animation-duration:30s;animation-delay:-8s}
.orbs i:nth-child(3){width:min(38vmax,340px);height:min(38vmax,340px);background:var(--o3);top:40%;right:30%;opacity:.4;animation-duration:36s;animation-delay:-14s}
@keyframes drift{to{transform:translate3d(-40px,50px,0) scale(1.14)}}

/* glass material */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur,26px)) saturate(180%);backdrop-filter:blur(var(--blur,26px)) saturate(180%);border:1px solid var(--stroke);box-shadow:0 12px 34px -10px var(--shadow),inset 0 1px 0 var(--hi);border-radius:26px}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,var(--sheen),transparent 42%,transparent 70%,var(--sheen))}
.glass>*{position:relative}

.pill{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--spring),filter .2s}
.pill:active,.circ:active,.card:active,.tab:active{transform:scale(.96)}
.pill.acc{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:var(--acc-ink);border-color:transparent;box-shadow:0 10px 22px -8px color-mix(in srgb,var(--acc1) 70%,transparent)}
.pill.dng{color:var(--danger)}
.pill.sm{min-height:36px;padding:0 14px;font-size:14px}
.circ{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:transform .2s var(--spring)}
.circ.dng{color:var(--danger)}

input,textarea{width:100%;background:var(--field);border:1px solid var(--stroke);border-radius:16px;padding:12px 14px;outline-offset:2px}
input::placeholder,textarea::placeholder{color:var(--ink2)}
input[type=search]{-webkit-appearance:none;appearance:none}

/* Dynamic Island */
#frame{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,520px);transform:translateX(-50%);overflow:hidden;pointer-events:none;z-index:100}
#frame>*{pointer-events:auto}
#island{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:112px;height:32px;background:#000;color:#fff;border-radius:20px;display:flex;align-items:center;gap:12px;padding:0 14px;overflow:hidden;z-index:80;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 8px 24px -8px rgba(0,0,0,.6);transition:width .6s var(--spring),height .6s var(--spring),border-radius .6s var(--spring)}
#island::before{content:"";position:absolute;top:50%;margin-top:-5px;inset-inline-end:12px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#34467f,#090d22 70%);transition:opacity .2s}
#island.open{width:min(calc(100% - 24px),376px);height:68px;border-radius:34px}
#island.open::before{opacity:0}
#island>*{opacity:0;transition:opacity .18s}
#island.open>*{opacity:1;transition:opacity .3s .2s}
#island .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:#2c2c3a;color:#fff}
#island .ic.ok{background:#27b463}#island .ic.info{background:#0a84ff}#island .ic.warn{background:#ff9f0a}#island .ic.bad{background:#ff453a}#island .ic.vio{background:#7a5cff}
#island .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
#island .tx b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#island .tx small{font-size:12.5px;color:rgba(255,255,255,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#island .act{border:0;border-radius:99px;background:#fff;color:#000;padding:8px 16px;font-size:14px;flex:none}

/* screens */
.lock{min-height:100%;display:grid;place-items:center;padding-block:76px 40px;padding-inline:max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-right,0px))}
#lockForm{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.logo{width:104px;height:104px;border-radius:26px;filter:drop-shadow(0 18px 30px color-mix(in srgb,var(--o1) 55%,transparent))}
.lname{margin:8px 0 0;font-size:44px;font-weight:600;line-height:1.15;letter-spacing:.5px}
.ltag{margin:0 0 10px;color:var(--ink2);max-width:30ch}
.pwwrap{width:100%;display:flex;align-items:center;gap:8px;padding:4px 14px;border-radius:999px;color:var(--ink2)}
.pwwrap input{background:none;border:0;padding:12px 4px;color:var(--ink);min-width:0}
.pwwrap input:focus-visible{outline:none}
.pwwrap:focus-within{outline:2px solid var(--acc1);outline-offset:2px}
.eye{background:none;border:0;color:var(--ink2);padding:6px;display:grid;place-items:center}
.err{min-height:1.4em;margin:0;color:var(--danger);font-size:14.5px}
.pill.big{width:100%;min-height:52px;font-size:17px}
.warn{margin:6px 0 0;color:var(--ink2);font-size:13px;max-width:34ch}

.app{max-width:520px;margin-inline:auto;padding-block:58px 140px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top .grow{flex:1}
.big{margin:16px 0 0;font-size:36px;line-height:1.25;font-weight:600}
.sub{margin:0 0 14px;color:var(--ink2);min-height:1.6em}
.search{display:flex;align-items:center;gap:10px;padding:2px 16px;border-radius:999px;margin-bottom:16px;color:var(--ink2)}
.search input{background:none;border:0;padding:12px 0;color:var(--ink)}
.search input:focus-visible{outline:none}
.search:focus-within{outline:2px solid var(--acc1);outline-offset:2px}

.card{display:block;width:100%;text-align:start;padding:16px 18px;margin-bottom:12px;color:var(--ink);transition:transform .2s var(--spring)}
.card h3{margin:0 0 4px;font-size:18px;font-weight:600;line-height:1.4}
.card p{margin:0 0 10px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;background:var(--glass2);border:1px solid var(--stroke)}
.tag svg.i{width:14px;height:14px}
.empty{display:grid;justify-items:center;gap:12px;text-align:center;padding:36px 20px;color:var(--ink2)}
.empty svg.i{width:44px;height:44px;opacity:.7}
.empty b{color:var(--ink);font-weight:600;font-size:18px}

.tabbar{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));height:68px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;border-radius:34px;z-index:40}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:58px;height:54px;border-radius:22px;font-size:11.5px;color:var(--ink2);transition:transform .2s var(--spring),background .25s}
.tab[aria-current=page]{color:var(--ink);background:var(--glass2)}
.tab[aria-current=page] svg{color:var(--acc1)}
.tab.add{width:56px;min-width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:var(--acc-ink);box-shadow:0 12px 24px -8px color-mix(in srgb,var(--acc1) 75%,transparent)}
.tab.add svg{width:26px;height:26px}

/* drawer */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.46);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s;z-index:60}
#scrim.on{opacity:1;visibility:visible;transition:opacity .3s}
#drawer{position:absolute;top:0;bottom:0;right:0;width:min(86%,332px);z-index:70;display:flex;flex-direction:column;gap:6px;padding:calc(64px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--sheet);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);border-inline-start:1px solid var(--stroke);border-radius:34px 0 0 34px;box-shadow:-20px 0 50px -20px var(--shadow);transform:translateX(104%);visibility:hidden;transition:transform .5s var(--soft),visibility 0s .5s}
#drawer.on{transform:none;visibility:visible;transition:transform .5s var(--soft)}
.dhead{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}
.dhead svg.logo{width:54px;height:54px;border-radius:14px;filter:none}
.dhead b{display:block;font-size:22px;font-weight:600;line-height:1.2}
.dhead small{color:var(--ink2)}
.ditem{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:0;border-radius:18px;background:none;color:var(--ink);text-align:start;font-size:16.5px;transition:background .2s}
.ditem:hover,.ditem[aria-current=page]{background:var(--glass2)}
.ditem svg.i{color:var(--acc1)}
.ditem .bd{margin-inline-start:auto;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--glass2);display:grid;place-items:center;font-size:13px;color:var(--ink2)}
.dsep{height:1px;background:var(--stroke);margin:8px 10px}

/* modal sheet */
#modal{position:absolute;inset:0;display:grid;align-items:end;justify-items:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.46);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;z-index:90}
#modal.on{opacity:1;visibility:visible;transition:opacity .25s}
.sheet{width:100%;max-width:440px;padding:24px 22px 20px;background:var(--sheet);transform:translateY(30px) scale(.97);transition:transform .45s var(--spring);text-align:center}
#modal.on .sheet{transform:none}
.sheet h2{margin:0 0 6px;font-size:21px;font-weight:600}
.sheet p{margin:0 0 18px;color:var(--ink2)}
.sheet .btns{display:grid;gap:10px}
.sheet .logo{width:64px;height:64px;border-radius:16px;filter:none;margin:0 auto 10px}
.linkbox{direction:ltr;text-align:left;font-size:14px;margin-bottom:14px}

/* editor */
.e-title{background:none;border:0;border-radius:0;padding:14px 2px 6px;font-size:28px;font-weight:600;line-height:1.35}
.e-title:focus-visible,.e-body:focus-visible{outline:none}
.e-body{background:none;border:0;border-radius:0;padding:6px 2px 14px;min-height:150px;resize:none;line-height:1.85;overflow:hidden}
.blk{padding:16px;margin-top:14px}
.blk h2{margin:0 0 12px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.blk h2 svg.i{color:var(--acc1)}
.lk{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;background:var(--field);margin-bottom:8px}
.lk a{display:flex;align-items:center;gap:12px;flex:1;min-width:0;color:var(--ink);text-decoration:none}
.lk .av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:var(--acc-ink);font-weight:600}
.lk .tt{min-width:0;direction:ltr;text-align:left;line-height:1.35}

/* ---------- crypto ---------- */
function b64e(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function b64d(s){var r=atob(s),b=new Uint8Array(r.length);for(var i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return b}
function rnd(n){var a=new Uint8Array(n);window.crypto.getRandomValues(a);return a}
function derive(pw,salt,iter){return C.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(km){return C.deriveKey({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])})}
function enc(key,text){var iv=rnd(12);return C.encrypt({name:"AES-GCM",iv:iv},key,new TextEncoder().encode(text)).then(function(ct){return {iv:b64e(iv),ct:b64e(ct)}})}
function dec(key,o){return C.decrypt({name:"AES-GCM",iv:b64d(o.iv)},key,b64d(o.ct)).then(function(pt){return new TextDecoder().decode(pt)})}
function weak(pw,salt){var s=salt+":"+pw,h1=5381,h2=52711;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=((h1<<5)+h1+c)>>>0;h2=((h2<<5)^h2^c)>>>0}return h1.toString(36)+h2.toString(36)}

var chain=Promise.resolve();
function commit(){
  chain=chain.then(function(){
    var m=S.meta;if(!m)return;m.settings=S.settings;
    if(m.enc){return enc(S.key,JSON.stringify(S.notes)).then(function(b){m.blob=b;wr(m)})}
    m.notes=S.notes;wr(m);
  }).catch(function(){});
  return chain;
}

function openApp(msg){
  S.notes=S.notes.filter(function(n){return !(n.deleted&&Date.now()-n.deleted>30*DAY)});
  S.unlocked=true;$("#lock").hidden=true;$("#app").hidden=false;

  if(msg)island(msg);

  });
}
async function submitLock(e){
  e.preventDefault();
  var pw=$("#pw1").value,err=$("#lockErr"),btn=$("#lockBtn");err.textContent="";
  var first=!S.meta;
  if(first){
    if(pw.length<4){err.textContent="كلمة السر لازم تكون 4 أحرف على الأقل.";return}
    if(pw!==$("#pw2").value){err.textContent="كلمتا السر غير متطابقتين.";return}
  }else if(!pw){err.textContent="اكتب كلمة السر.";return}
  btn.disabled=true;var old=btn.textContent;btn.textContent="لحظة...";
  try{
    if(first){
      var m={v:1,settings:S.settings};
      if(C){m.enc=true;m.iter=150000;m.salt=b64e(rnd(16));S.key=await derive(pw,b64d(m.salt),m.iter);m.check=await enc(S.key,"khabaya");S.notes=sampleNotes();m.blob=await enc(S.key,JSON.stringify(S.notes))}
      else{m.enc=false;m.salt=Math.random().toString(36).slice(2);m.h=weak(pw,m.salt);S.notes=sampleNotes();m.notes=S.notes}
      S.meta=m;wr(m);openApp({icon:"shield",tone:"ok",title:"تم إنشاء كلمة السر",sub:"أهلًا بك في Veilo"});
    }else{
      var m2=S.meta,ok=false;
      if(m2.enc){
        try{var k=await derive(pw,b64d(m2.salt),m2.iter);var c=await dec(k,m2.check);if(c==="khabaya"){S.key=k;S.notes=JSON.parse(await dec(k,m2.blob));ok=true}}catch(x){ok=false}
      }else if(weak(pw,m2.salt)===m2.h){S.notes=m2.notes||[];ok=true}
      if(ok)openApp({icon:"unlock",tone:"ok",title:"تم الفتح",sub:"أهلًا بعودتك"});
      else{err.textContent="كلمة السر غير صحيحة.";$("#pw1").select()}
    }
  }catch(x){err.textContent="حصلت مشكلة أثناء الفتح. حاول مرة أخرى."}
  btn.disabled=false;btn.textContent=first&&!S.unlocked?old:(S.meta?"فتح":old);
}
async function verifyPw(pw){
  var m=S.meta;
  if(m.enc){try{var k=await derive(pw,b64d(m.salt),m.iter);return (await dec(k,m.check))==="khabaya"}catch(e){return false}}
  return weak(pw,m.salt)===m.h;
}
async function changePw(oldp,newp){
  var m=S.meta;
  if(m.enc){m.salt=b64e(rnd(16));S.key=await derive(newp,b64d(m.salt),m.iter);m.check=await enc(S.key,"khabaya")}
  else{m.salt=Math.random().toString(36).slice(2);m.h=weak(newp,m.salt)}
  await commit();
}
